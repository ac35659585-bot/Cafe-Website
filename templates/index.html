<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Finder & Booking</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header>
        <nav class="navbar">
            <div class="logo">Nearby Cafes ☕</div>
            <ul class="nav-links">
                <li><a href="/" class="active">Home</a></li>
                <li><a href="/menu">Menu</a></li>
                <li><a href="/booking">Book Table</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Discover & Book Nearby Cafes</h1>
            <p>Find the best coffee spots around you and reserve your table in seconds.</p>
        </div>
    </section>

    <!-- Cafes Listing Section -->
    <section style="padding: 40px; max-width: 1100px; margin: auto;">
        <h2 style="text-align: center; margin-bottom: 30px;">Popular Cafes Near You</h2>
        
        <div style="display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;">
            {% for cafe in cafes %}
            <div style="border: 1px solid #ccc; border-radius: 10px; overflow: hidden; width: 300px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); background: #fff;">
                <img src="{{ cafe.image }}" alt="{{ cafe.name }}" style="width: 100%; height: 180px; object-fit: cover;">
                <div style="padding: 15px;">
                    <h3>{{ cafe.name }}</h3>
                    <p style="color: #666; margin: 5px 0;">📍 {{ cafe.location }}</p>
                    <p style="color: #d97706; font-weight: bold; margin-bottom: 15px;">{{ cafe.rating }}</p>
                    <a href="/booking?cafe={{ cafe.name }}" class="btn btn-primary" style="display: block; text-align: center; text-decoration: none;">Book Table</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </section>

</body>
</html>
